name: Dependabot auto-merge

on: pull_request

# Dependabot-triggered runs get a read-only token unless the workflow asks for
# more, and the ask has to be here rather than on the job: without both of
# these, `gh pr merge` fails with a permissions error rather than merging.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # `--auto` hands the merge to GitHub instead of performing it here: the
      # PR is armed now, while its checks are still running, and GitHub merges
      # it only once `build` and `generate` pass. Both are required checks on
      # main, so a red run leaves the PR sitting open rather than merged — the
      # gate is the branch protection, not this workflow's own judgement.
      - name: Arm auto-merge
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
